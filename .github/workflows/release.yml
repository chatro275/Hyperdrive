name: Test and release Hyperdrive
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js && node --check static/hyperdrive.js
      - run: python scripts/package-kodi.py && python scripts/package-update.py
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package-kodi.py && python scripts/package-update.py
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(cat VERSION)"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Version already released; keeping published assets unchanged."
          else
            gh release create "$version" frame-update-*.zip frame-kodi.zip hyperdrive-kodi.zip --target "$GITHUB_SHA" --generate-notes
          fi
